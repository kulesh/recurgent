version: 1
id: calculator-live-shadow-v1
class: class_1
description: Live-shadow calculator script evaluating semantic arithmetic outcomes and state continuity.
execution:
  lane: live_shadow
  isolation: run_scoped
scenario:
  role: calculator
  script:
    - step_id: set_memory
      call: memory=
      args: [5]
    - step_id: add
      call: add
      args: [3]
    - step_id: multiply
      call: multiply
      args: [4]
    - step_id: sqrt
      call: sqrt
      args: [144]
scoring_profile:
  id: calculator_live_shadow_v1
  weights:
    correctness: 0.7
    contract_adherence: 0.15
    repair_efficiency: 0.1
    reuse: 0.05
replay:
  mode: fixture
  seeds: [11, 19, 23, 31, 43]
oracles:
  - id: add_expected_value
    kind: live_outcome_value
    input:
      step: add
      value_path: ""
    expect:
      value: 8.0
      tolerance: 0.000001
  - id: multiply_expected_value
    kind: live_outcome_value
    input:
      step: multiply
      value_path: ""
    expect:
      value: 32.0
      tolerance: 0.000001
  - id: sqrt_expected_value
    kind: live_outcome_value
    input:
      step: sqrt
      value_path: ""
    expect:
      value: 12.0
      tolerance: 0.000001
