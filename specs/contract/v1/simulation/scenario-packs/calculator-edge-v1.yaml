    kind: calculator_error_case
    input:
      expression: sqrt(-9)
    expect:
      error_type: domain_error
  - id: divide_by_zero_reports_error
    kind: calculator_error_case
    input:
      expression: 10 / 0
    expect:
      error_type: zero_division
  - id: malformed_expression_reports_parse_error
    kind: calculator_error_case
    input:
      expression: 2x + = 4
    expect:
      error_type: parse_error
