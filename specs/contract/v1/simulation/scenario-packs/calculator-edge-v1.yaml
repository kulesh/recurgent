version: 1
id: calculator-edge-v1
class: class_1
description: Deterministic edge/error pack for calculator readiness gating.
execution:
  lane: deterministic
  isolation: run_scoped
scoring_profile:
  id: calculator_edge_v1
  weights:
    correctness: 0.7
    contract_adherence: 0.15
    repair_efficiency: 0.1
    reuse: 0.05
replay:
  mode: fixture
  seeds: [11, 19, 23, 31, 43, 59, 71, 97]
oracles:
